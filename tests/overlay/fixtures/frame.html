<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Embedded lecture player</title>
  </head>
  <body style="margin: 0">
    <!-- An embedded player: its video plays a file of its own; the injected script runs here too.
         It reports to the test's page, which stands in for the top frame: `?up=<n>` frames up (1 by default). -->
    <video src="/vto-none/lecture.mp4" style="display: block; width: 100%; height: 100%"></video>
    <script type="module">
      import { startPage } from '/src/overlay/page.ts';
      let top = window;
      for (let n = Number(new URLSearchParams(location.search).get('up')) || 1; n > 0; n--) top = top.parent;
      startPage({ top, request: async () => ({ status: 500, body: {} }) });
    </script>
  </body>
</html>
