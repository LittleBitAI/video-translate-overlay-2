{
  "openapi": "3.1.0",
  "info": {
    "title": "video-translate-overlay-2",
    "version": "0.1.0",
    "description": "Native library/browser/job/subtitle requests carry account_generation captured by their screen. Successful replies include it; retired requests return 409 account_changed without data. Only P7 may return the current counter in an account_required error to bootstrap a newly injected overlay; it returns no library or identity data. Site capabilities remain P6-P8. Google identity enrolls a sealed certificate-bound device credential for at most 30 days; fresh Google verification is required for unknown peer enrollment. Expiry stops transfers while retaining local account-library access. Sign-out selects the original unowned library. Credentials, cookies and unfinished jobs are never imported or synchronized."
  },
  "paths": {
    "/privacy/open": {
      "post": {
        "operationId": "P18",
        "summary": "Open only the fixed published privacy policy in the platform browser. Native local screens only; no caller-supplied URL, account mutation or video navigation. HTTP and site callers are refused.",
        "responses": {
          "200": {"description": "opened=true and the fixed public privacy-policy URL"},
          "403": {"description": "native_required or denied site capability"},
          "503": {"description": "privacy_unavailable with a fixed retryable message"}
        }
      }
    },
    "/account": {
      "get": {
        "operationId": "P15",
        "summary": "Native app Google account status, separate from YouTube. App screens only. Never return tokens, subject, nonce, paths or credentials.",
        "responses": {
          "200": {"description": "generation, state (unsupported/loading/signed_out/signing_in/signed_in/expired/unavailable), email or null, fixed error or null, sync_ready, and optional connection (generation, fixed state, last_success timestamp or null). Connection states distinguish private-network, discovery, listener, authentication, account mismatch, background and transport recovery. No endpoint or peer identity is returned. Only a recent authenticated page exchange sets sync_ready; identity alone does not."},
          "503": {"description": "Account status unavailable"}
        }
      }
    },
    "/account/sign-in": {
      "post": {
        "operationId": "P16",
        "summary": "Start native Google sign-in for the captured account generation. Return that operation's pending generation before waiting for the browser/account picker. Local native screens only; HTTP returns 403 native_required.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["generation"], "properties": {"generation": {"type": "integer", "minimum": 0}}}}}},
        "responses": {
          "200": {"description": "Whitelisted account status. Poll P15 for completion; P17 cancels using this operation's generation."},
          "409": {"description": "Captured generation is stale or the operation was cancelled"},
          "503": {"description": "Native sign-in or credential storage unavailable, or auth_registration when the publisher's Desktop client registration is missing or rejected. Never include provider response bodies or credentials."}
        }
      }
    },
    "/account/sign-out": {
      "post": {
        "operationId": "P17",
        "summary": "Cancel the captured native Google session or pending sign-in and clear only its sealed Google credentials. Preserve saved data, Gemini key and YouTube cookies. Native app screen only; HTTP returns 403 native_required.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["generation"], "properties": {"generation": {"type": "integer", "minimum": 0}}}}}},
        "responses": {
          "200": {"description": "Whitelisted status at the new generation"},
          "409": {"description": "Captured generation is stale"},
          "503": {"description": "Native credential deletion unavailable; old in-memory tickets remain cancelled"}
        }
      }
    },
    "/updates/check": {
      "post": {
        "operationId": "P12",
        "summary": "Check approved GitHub releases for this build's platform. Local app screen only. Coalesce in-flight checks; automatic checks cache for 60 seconds; each caller waits at most 15 seconds.",
        "requestBody": {"content": {"application/json": {"schema": {"type": "object", "properties": {"manual": {"type": "boolean", "default": false}}}}}},
        "responses": {
          "200": {"description": "installed_version, platform, update (null or version/summary/download_url), and dismissed. Manual checks can reveal the dismissed version. No update means no applicable approved release in the bounded release list."},
          "503": {"description": "update_check_failed: unreachable, timeout, malformed metadata, or unsuccessful GitHub response. Never report this as up to date."}
        }
      }
    },
    "/updates/dismiss": {
      "post": {
        "operationId": "P13",
        "summary": "Persist the dismissed stable version in the app data directory; do not modify credentials or video/library tables. Local app screen only.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["version"], "properties": {"version": {"type": "string", "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$"}}}}}},
        "responses": {"200": {"description": "Dismissed version"}, "400": {"description": "Invalid stable version"}, "500": {"description": "Could not persist dismissal"}}
      }
    },
    "/updates/open": {
      "post": {
        "operationId": "P14",
        "summary": "Recheck the selected release, then open only its validated HTTPS GitHub platform asset in the external browser. The caller supplies a version, never an arbitrary URL. Local app screen only; HTTP browser screens follow the validated link directly.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["version"], "properties": {"version": {"type": "string"}}}}}},
        "responses": {"200": {"description": "External browser opened"}, "409": {"description": "The version is no longer selected or its applicable artifact is unavailable"}, "503": {"description": "Check or browser launch failed"}}
      }
    },
    "/library/data": {
      "get": {
        "operationId": "P10",
        "summary": "Read the selected account's local library and ordered playlists in one snapshot, or the original unowned library while signed out. App screen only; no paid calls. Existing unowned data is copied to an account only after explicit import consent.",
        "responses": {
          "200": {
            "description": "Library snapshot",
            "content": {"application/json": {"schema": {
              "type": "object", "required": ["videos", "playlists"],
              "properties": {
                "legacy_available": {"type": "boolean", "description": "An account is selected and the unowned device library offers data not previously imported. Import is optional."},
                "account_email": {"type": ["string", "null"], "description": "Display label for the captured native account. Never used as the ownership or authentication key."},
                "videos": {"type": "array", "items": {
                  "type": "object",
                  "required": ["video_key", "page_url", "title", "duration_ms", "saved", "active", "deleting"],
                  "properties": {
                    "video_key": {"type": "string"}, "page_url": {"type": "string"},
                    "title": {"type": "string"}, "duration_ms": {"type": "integer"},
                    "saved": {"type": "boolean"}, "active": {"type": "boolean"}, "deleting": {"type": "boolean"},
                    "versions": {"type": "array", "description": "Retained account translation metadata, newest selected/completed first; empty for unowned or deleting videos. No transcript bodies.", "items": {"type": "object", "properties": {"id": {"type": "string"}, "selected": {"type": "boolean"}}}}
                  }
                }},
                "playlists": {"type": "array", "items": {
                  "type": "object", "required": ["id", "name", "entries"],
                  "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "entries": {"type": "array", "items": {"type": "string"}}}
                }}
              }
            }}}
          },
          "500": {"description": "Storage read failed; show a retry, not an empty success"}
        }
      },
      "post": {
        "operationId": "P11",
        "summary": "Mutate the device-local library. App screen only; never translates or chains playback.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {
          "type": "object", "required": ["action"],
          "properties": {
            "action": {"type": "string", "enum": ["create_playlist", "rename_playlist", "delete_playlist", "move_playlist", "add_entry", "remove_entry", "move_entry", "delete_video", "import_legacy", "select_translation"]},
            "account_generation": {"type": "integer", "minimum": 0, "description": "The generation captured with the displayed library; native IPC carries it beside the action body."},
            "playlist_id": {"type": "string"}, "name": {"type": "string", "minLength": 1, "maxLength": 200},
            "page_url": {"type": "string"}, "title": {"type": "string"}, "video_key": {"type": "string"},
            "translation_id": {"type": "string", "description": "select_translation requires this retained id and video_key in the captured account. Refuses active or deleted videos. Selection republishes the completed version through the existing journal format; no model or Gemini call. Reopen the video to use the selected cues."},
            "delta": {"type": "integer", "not": {"const": 0}, "description": "Places to move: negative toward the start, positive toward the end. Any non-zero step is one request and one transaction; the target is clamped to the first or last place and the items between shift by one. Each changed row is stored and synchronized with its absolute position."}, "confirmed": {"type": "boolean"}
          },
          "description": "create_playlist requires name; rename_playlist requires playlist_id/name; delete_playlist requires playlist_id; move_playlist requires playlist_id/delta; add_entry requires playlist_id/page_url and optional title; remove_entry and move_entry require playlist_id/video_key, with delta for move_entry. delete_video requires video_key, exact current title, confirmed=true after warning about permanent removal and future API cost. Native import_legacy requires confirmed=true and a current selected account; copies completed translations, links and playlists idempotently, preserving original cues, cost and source library. HTTP(S) links are stored without probing; YouTube must name a video. Media support is checked only on explicit translation. Membership is idempotent within a playlist, and a video may belong to multiple playlists."
        }}}},
        "responses": {
          "200": {"description": "Committed change; refresh the library", "content": {"application/json": {"schema": {"type": "object", "properties": {"changed": {"const": true}}}}}},
          "400": {"description": "Invalid action, name, link, move or named confirmation"},
          "404": {"description": "Missing playlist or video"},
          "409": {"description": "video_active or cleanup_pending"},
          "503": {"description": "cleanup_failed: subtitles are hidden; deletion can be retried"},
          "500": {"description": "Storage or view invalidation failure; refresh and retry"}
        }
      }
    },
    "/browser/open": {
      "post": {
        "operationId": "P1",
        "summary": "주소 칸에 넣은 주소나 알림에 실린 주소를 앱 안 화면에 열고 영상 위에 오버레이를 얹는다. 유튜브를 처음 여는 때에는 구글의 계정 화면을 먼저 열고, 거기서 건너뛰거나 막히면 그대로 유튜브를 연다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "url": {
                    "description": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "opened_url": {
                      "description": "string"
                    },
                    "site": {
                      "description": "string"
                    },
                    "account_gate": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "400"
          }
        }
      }
    },
    "/browser": {
      "get": {
        "operationId": "P9",
        "summary": "마지막으로 연 주소와 해당 영상의 작업. Google 로그인 후 원래 영상으로 돌아오면 영상 주소로 갱신하며, 늦은 로그인 결과는 새 주소를 덮지 않는다. 작업이 없으면 null.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "url": {
                      "description": "string | null"
                    },
                    "job": {
                      "description": "P7's body | null"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/browser/site-data": {
      "delete": {
        "operationId": "P2",
        "summary": "앱 안 화면에 쌓인 쿠키와 사이트 자료를 지워 유튜브 계정 연결을 끊는다. 다음에 유튜브를 열면 구글의 계정 화면이 다시 먼저 뜬다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "cleared": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/settings": {
      "get": {
        "operationId": "P3",
        "summary": "설정 화면에 보일 값을 준다. 개인키는 끝 네 글자만 남기고 가려서 주고, 최애의 목소리는 이번에 만들지 않으므로 늘 꺼짐으로 알린다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "key_set": {
                      "description": "boolean"
                    },
                    "key_masked": {
                      "description": "string | null"
                    },
                    "translation_model": {
                      "description": "string"
                    },
                    "favorite_voice_available": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/settings/api-key": {
      "put": {
        "operationId": "P4",
        "summary": "개인키를 Gemini에 한 번 확인한 다음 기기의 보안 저장소에 넣는다. 응답과 기록에는 끝 네 글자만 남는다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "api_key": {
                    "description": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "key_set": {
                      "description": "boolean"
                    },
                    "key_masked": {
                      "description": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "400"
          },
          "401": {
            "description": "401"
          },
          "503": {
            "description": "503"
          }
        }
      },
      "delete": {
        "operationId": "P5",
        "summary": "개인키를 기기에서 지운다. 지운 뒤에 영상감지 버튼을 누르면 개인키를 넣으라는 안내가 뜬다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "key_set": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/playback": {
      "get": {
        "operationId": "getPlayback",
        "summary": "P7 get_job playback_action=get. Existing site permission; captured account_generation and page_url required. No job or translation is started.",
        "responses": {"200": {"description": "video_key, position_ms or null, original duration_ms (zero for an untranslated link), account_generation."}, "404": {"description": "Video is not in the selected library"}, "410": {"description": "Video deleted"}}
      },
      "put": {
        "operationId": "setPlayback",
        "summary": "P7 get_job playback_action=set. Atomically persist and journal actual playback position; no cue, job, credential or file mutation.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["page_url", "account_generation", "position_ms", "duration_ms"], "properties": {"page_url": {"type": "string", "format": "uri"}, "account_generation": {"type": "integer", "minimum": 0}, "position_ms": {"type": "integer", "minimum": 0, "maximum": 21600000}, "duration_ms": {"type": "integer", "minimum": 1, "maximum": 21600000}}}}}},
        "responses": {"200": {"description": "Same bounded response as GET. Position cannot exceed player duration or known original duration."}, "400": {"description": "Invalid position or duration"}, "409": {"description": "Account retired, cleanup pending, or player duration differs from saved duration by more than one second"}, "410": {"description": "Video deleted"}}
      }
    },
    "/jobs": {
      "post": {
        "operationId": "P6",
        "summary": "기본 동작은 완료된 자막을 재사용하거나 내려받기·받아쓰기·번역 작업을 만든다. retranslate=true이면 완료된 원문과 시각을 유지해 번역만 다시 만든다. 추가 API 비용이 발생하며 이전 사용량과 비용을 이어 받아 한도를 유지한다. 주소는 http나 https여야 하고 media_url은 기기 자신이나 사설망을 가리키면 받지 않는다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "page_url": {
                    "description": "string"
                  },
                  "media_url": {
                    "description": "string | null. 유튜브는 앱 브라우저 세션에서 받은 녹화 영상의 서명된 googlevideo 오디오 주소를 우선 사용한다. 주소 정책·DRM·실제 오디오 검사는 Rust에서 수행한다."
                  },
                  "title": {
                    "description": "string"
                  },
                  "duration_ms": {
                    "description": "integer"
                  },
                  "retranslate": {
                    "description": "boolean, 기본 false. true이면 완료된 원문과 시각을 유지해 번역만 다시 만든다. 기존 사용량과 비용을 새 작업에 이어 받아 비용 한도를 유지한다. API 키가 없거나 다른 영상이 처리 중이면 기존 자막을 보존한다."
                  },
                  "deletion_token": {
                    "type": "string",
                    "description": "Fresh token from a completed video_deleted response. Send only after explicit confirmation about possible API costs; normal key, duration, media and cost safeguards apply."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "job_id": {
                      "description": "string"
                    },
                    "video_key": {
                      "description": "string"
                    },
                    "stage": {
                      "description": "string"
                    },
                    "reused": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "400"
          },
          "409": {
            "description": "409"
          },
          "422": {
            "description": "422"
          },
          "428": {
            "description": "428"
          },
          "410": {
            "description": "video_deleted: no job is created. A complete deletion includes deletion_token for a later explicit confirmation; an incomplete deletion requires cleanup retry. Old tokens and retranslation requests cannot recreate records."
          }
        }
      },
      "get": {
        "operationId": "P7",
        "summary": "주소로 찾은 영상의 가장 최근 작업이 어디까지 왔는지 진행 상태를 준다. 어느 단계인지, 그 단계가 몇 퍼센트 됐는지, 실패했다면 그 까닭, 번역 모듈에 쓴 양으로 셈한 비용이 들어 있다. 앱을 껐다 켠 뒤에도 같은 주소로 물으면 이어진 작업이 나온다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "page_url": {
                    "description": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "job_id": {
                      "description": "string"
                    },
                    "video_key": {
                      "description": "string"
                    },
                    "title": {
                      "description": "string"
                    },
                    "stage": {
                      "description": "string"
                    },
                    "percent": {
                      "description": "integer"
                    },
                    "preparing_model": {
                      "description": "boolean: true while the downloading stage is fetching the on-device speech model (first use), before the audio transfer"
                    },
                    "failure_reason": {
                      "description": "string | null"
                    },
                    "input_amount": {
                      "description": "integer: input tokens of the job plus those of every summary call for the video (P19)"
                    },
                    "output_amount": {
                      "description": "integer: output tokens (thinking included) of the job plus those of every summary call for the video (P19)"
                    },
                    "cost_krw": {
                      "description": "number: the video's shown cost, the job's translation cost plus summary_cost_krw"
                    },
                    "summary_cost_krw": {
                      "description": "number: what every summary call for the video cost, valid reply or not: reported usage times the translation's unit prices and exchange rate"
                    },
                    "notified": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "400"
          },
          "404": {
            "description": "404"
          },
          "410": {
            "description": "video_deleted: saved job data is unavailable. deletion_token is present only when cleanup is complete; pending deletion must be retried in the library."
          }
        }
      }
    },
    "/videos/{video_key}/subtitles": {
      "parameters": [{"name": "video_key", "in": "path", "required": true, "schema": {"type": "string"}, "description": "The video's key, as P7 returns it"}],
      "get": {
        "operationId": "P8",
        "summary": "작업이 끝난 영상의 자막을 통째로 준다. 조각마다 본편 처음부터 잰 시작 시각과 끝 시각이 붙어 있어 오버레이가 재생 위치에 맞는 조각을 고른다. 광고를 가려낼 때 쓸 본편 길이도 함께 준다. 작업이 끝나기 전에는 자막을 주지 않는다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "video_key": {
                      "description": "string"
                    },
                    "duration_ms": {
                      "description": "integer"
                    },
                    "source_language": {
                      "description": "string"
                    },
                    "cues": {
                      "description": "[{seq: integer, start_ms: integer, end_ms: integer, text_ko: string}]"
                    }
                  }
                }
              }
            }
          },
          "404": {
            "description": "404"
          },
          "409": {
            "description": "409"
          },
          "410": {
            "description": "video_deleted: clear displayed cues and ignore earlier subtitle responses. Never start translation from a subtitle read."
          }
        }
      }
    },
    "/videos/{video_key}/summary": {
      "parameters": [{"name": "video_key", "in": "path", "required": true, "schema": {"type": "string"}, "description": "The video's key, as P7 returns it"}],
      "get": {
        "operationId": "P19-get",
        "summary": "The stored summary of a video, with no Gemini call. Local app screens only; site capabilities stay P6-P8.",
        "responses": {
