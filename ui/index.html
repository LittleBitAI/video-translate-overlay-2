<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 번역 오버레이</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, "Noto Sans KR", sans-serif; }
  body { margin: 0 auto; padding: 16px; max-width: 560px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 8px; }
  button { font: inherit; padding: 8px 12px; }
  p { margin: 8px 0; }
  .note { font-size: 13px; opacity: 0.75; }
  .error { color: #e53935; }
</style>
</head>
<body>
<h1>영상 번역 오버레이</h1>

<h2>영상 사이트 열기</h2>
<form id="open">
  <input id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/" value="https://www.youtube.com/" required>
  <button type="submit">열기</button>
</form>
<p class="note">영상 위에 뜨는 <b>영상감지</b> 버튼을 누르면 자막을 만들기 시작합니다. 다 되면 알림이 갑니다.</p>

<section id="ready-section" hidden>
  <h2>자막 준비 완료</h2>
  <ul id="ready"></ul>
</section>

<h2>Gemini API 키</h2>
<p id="key-state">확인하는 중…</p>
<form id="key">
  <input id="api-key" type="password" autocomplete="off" placeholder="AIza…" required>
  <button type="submit">저장</button>
</form>
<p><button id="delete-key" type="button">키 지우기</button></p>
<p class="note">키는 이 기기에만 저장되고 화면에는 끝 네 자리만 보입니다. 번역 비용은 이 키의 계정에 청구됩니다.</p>

<h2>사이트 데이터</h2>
<p><button id="clear" type="button">로그인과 사이트 데이터 지우기</button></p>

<p id="message" role="status"></p>

<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const $ = (id) => document.getElementById(id);
  const say = (text, error) => { $('message').textContent = text; $('message').className = error ? 'error' : ''; };
  const fail = (e) => say(e?.message ?? String(e), true);
  const open = async (url) => {
    try { await invoke('browser_open', { url }); say(''); } catch (e) { fail(e); }
  };

  // Called by the app when a job's subtitles are ready (the same notice as the OS notification).
  window.vtoReady = ({ text, url }) => {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '열기';
    button.addEventListener('click', () => open(url));
    li.append(`${text} `, button);
    $('ready').prepend(li);
    $('ready-section').hidden = false;
  };

  async function refresh() {
    try {
      const s = await invoke('get_settings');
      $('key-state').textContent = s.key_set ? `저장된 키: ${s.key_masked} (번역 모델 ${s.translation_model})` : '저장된 키가 없습니다.';
    } catch (e) { fail(e); }
  }

  $('open').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    await open($('url').value);
  });
  $('key').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    say('키를 확인하는 중…');
    try { await invoke('put_api_key', { api_key: $('api-key').value }); $('api-key').value = ''; say('키를 저장했습니다.'); }
    catch (e) { fail(e); }
    refresh();
  });
  $('delete-key').addEventListener('click', async () => {
    try { await invoke('delete_api_key'); say('키를 지웠습니다.'); } catch (e) { fail(e); }
    refresh();
  });
  $('clear').addEventListener('click', async () => {
    try { await invoke('clear_site_data'); say('사이트 데이터를 지웠습니다.'); } catch (e) { fail(e); }
  });
  refresh();
</script>
</body>
</html>
