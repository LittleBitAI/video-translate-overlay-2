name: CI

on: [push, pull_request]

jobs:
  gate:
    # Windows: the gate's decoding tests run against Media Foundation, and the
    # app's key store is Windows Credential Manager.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Gate
        shell: bash
        run: npm ci --prefer-offline --no-audit --no-fund && node scripts/contract-tests.mjs artifacts/junit.xml && npm run test:ui && npm run build
      - name: Release packaging guards
        shell: pwsh
        run: ./tests/package-release.test.ps1
