{
  "openapi": "3.1.0",
  "info": {
    "title": "video-translate-overlay-2",
    "version": "0.1.0"
  },
  "paths": {
    "/library/data": {
      "get": {
        "operationId": "P10",
        "summary": "Read this device's library and ordered playlists in one snapshot. App screen only; no paid calls. Existing saved rows are read in place.",
        "responses": {
          "200": {
            "description": "Library snapshot",
            "content": {"application/json": {"schema": {
              "type": "object", "required": ["videos", "playlists"],
              "properties": {
                "videos": {"type": "array", "items": {
                  "type": "object",
                  "required": ["video_key", "page_url", "title", "duration_ms", "saved", "active", "deleting"],
                  "properties": {
                    "video_key": {"type": "string"}, "page_url": {"type": "string"},
                    "title": {"type": "string"}, "duration_ms": {"type": "integer"},
                    "saved": {"type": "boolean"}, "active": {"type": "boolean"}, "deleting": {"type": "boolean"}
                  }
                }},
                "playlists": {"type": "array", "items": {
                  "type": "object", "required": ["id", "name", "entries"],
                  "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "entries": {"type": "array", "items": {"type": "string"}}}
                }}
              }
            }}}
          },
          "500": {"description": "Storage read failed; show a retry, not an empty success"}
        }
      },
      "post": {
        "operationId": "P11",
        "summary": "Mutate the device-local library. App screen only; never translates or chains playback.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {
          "type": "object", "required": ["action"],
          "properties": {
            "action": {"type": "string", "enum": ["create_playlist", "rename_playlist", "delete_playlist", "move_playlist", "add_entry", "remove_entry", "move_entry", "delete_video"]},
            "playlist_id": {"type": "string"}, "name": {"type": "string", "minLength": 1, "maxLength": 200},
            "page_url": {"type": "string"}, "title": {"type": "string"}, "video_key": {"type": "string"},
            "delta": {"type": "integer", "enum": [-1, 1]}, "confirmed": {"type": "boolean"}
          },
          "description": "create_playlist requires name; rename_playlist requires playlist_id/name; delete_playlist requires playlist_id; move_playlist requires playlist_id/delta; add_entry requires playlist_id/page_url and optional title; remove_entry and move_entry require playlist_id/video_key, with delta for move_entry. delete_video requires video_key, exact current title, confirmed=true after warning about permanent removal and future API cost. HTTP(S) links are stored without probing; YouTube must name a video. Media support is checked only on explicit translation. Membership is idempotent within a playlist, and a video may belong to multiple playlists."
        }}}},
        "responses": {
          "200": {"description": "Committed change; refresh the library", "content": {"application/json": {"schema": {"type": "object", "properties": {"changed": {"const": true}}}}}},
          "400": {"description": "Invalid action, name, link, move or named confirmation"},
          "404": {"description": "Missing playlist or video"},
          "409": {"description": "video_active or cleanup_pending"},
          "503": {"description": "cleanup_failed: subtitles are hidden; deletion can be retried"},
          "500": {"description": "Storage or view invalidation failure; refresh and retry"}
        }
      }
    },
    "/browser/open": {
      "post": {
        "operationId": "P1",
        "summary": "주소 칸에 넣은 주소나 알림에 실린 주소를 앱 안 화면에 열고 영상 위에 오버레이를 얹는다. 유튜브를 처음 여는 때에는 구글의 계정 화면을 먼저 열고, 거기서 건너뛰거나 막히면 그대로 유튜브를 연다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "url": {
                    "description": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "opened_url": {
                      "description": "string"
                    },
                    "site": {
                      "description": "string"
                    },
                    "account_gate": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "400"
          }
        }
      }
    },
    "/browser": {
      "get": {
        "operationId": "P9",
        "summary": "마지막으로 연 주소와 해당 영상의 작업. Google 로그인 후 원래 영상으로 돌아오면 영상 주소로 갱신하며, 늦은 로그인 결과는 새 주소를 덮지 않는다. 작업이 없으면 null.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "url": {
                      "description": "string | null"
                    },
                    "job": {
                      "description": "P7's body | null"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/browser/site-data": {
      "delete": {
        "operationId": "P2",
        "summary": "앱 안 화면에 쌓인 쿠키와 사이트 자료를 지워 유튜브 계정 연결을 끊는다. 다음에 유튜브를 열면 구글의 계정 화면이 다시 먼저 뜬다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "cleared": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/settings": {
      "get": {
        "operationId": "P3",
        "summary": "설정 화면에 보일 값을 준다. 개인키는 끝 네 글자만 남기고 가려서 주고, 최애의 목소리는 이번에 만들지 않으므로 늘 꺼짐으로 알린다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "key_set": {
                      "description": "boolean"
                    },
                    "key_masked": {
                      "description": "string | null"
                    },
                    "translation_model": {
                      "description": "string"
                    },
                    "favorite_voice_available": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/settings/api-key": {
      "put": {
        "operationId": "P4",
        "summary": "개인키를 Gemini에 한 번 확인한 다음 기기의 보안 저장소에 넣는다. 응답과 기록에는 끝 네 글자만 남는다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "api_key": {
                    "description": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "key_set": {
                      "description": "boolean"
                    },
                    "key_masked": {
                      "description": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "400"
          },
          "401": {
            "description": "401"
          },
          "503": {
            "description": "503"
          }
        }
      },
      "delete": {
        "operationId": "P5",
        "summary": "개인키를 기기에서 지운다. 지운 뒤에 영상감지 버튼을 누르면 개인키를 넣으라는 안내가 뜬다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "key_set": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/jobs": {
      "post": {
        "operationId": "P6",
        "summary": "기본 동작은 완료된 자막을 재사용하거나 내려받기·받아쓰기·번역 작업을 만든다. retranslate=true이면 완료된 원문과 시각을 유지해 번역만 다시 만든다. 추가 API 비용이 발생하며 이전 사용량과 비용을 이어 받아 한도를 유지한다. 주소는 http나 https여야 하고 media_url은 기기 자신이나 사설망을 가리키면 받지 않는다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "page_url": {
                    "description": "string"
                  },
                  "media_url": {
                    "description": "string | null. 유튜브는 앱 브라우저 세션에서 받은 녹화 영상의 서명된 googlevideo 오디오 주소를 우선 사용한다. 주소 정책·DRM·실제 오디오 검사는 Rust에서 수행한다."
                  },
                  "title": {
                    "description": "string"
                  },
                  "duration_ms": {
                    "description": "integer"
                  },
                  "retranslate": {
                    "description": "boolean, 기본 false. true이면 완료된 원문과 시각을 유지해 번역만 다시 만든다. 기존 사용량과 비용을 새 작업에 이어 받아 비용 한도를 유지한다. API 키가 없거나 다른 영상이 처리 중이면 기존 자막을 보존한다."
                  },
                  "deletion_token": {
                    "type": "string",
                    "description": "Fresh token from a completed video_deleted response. Send only after explicit confirmation about possible API costs; normal key, duration, media and cost safeguards apply."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "job_id": {
                      "description": "string"
                    },
                    "video_key": {
                      "description": "string"
                    },
                    "stage": {
                      "description": "string"
                    },
                    "reused": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "400"
          },
          "409": {
            "description": "409"
          },
          "422": {
            "description": "422"
          },
          "428": {
            "description": "428"
          },
          "410": {
            "description": "video_deleted: no job is created. A complete deletion includes deletion_token for a later explicit confirmation; an incomplete deletion requires cleanup retry. Old tokens and retranslation requests cannot recreate records."
          }
        }
      },
      "get": {
        "operationId": "P7",
        "summary": "주소로 찾은 영상의 가장 최근 작업이 어디까지 왔는지 진행 상태를 준다. 어느 단계인지, 그 단계가 몇 퍼센트 됐는지, 실패했다면 그 까닭, 번역 모듈에 쓴 양으로 셈한 비용이 들어 있다. 앱을 껐다 켠 뒤에도 같은 주소로 물으면 이어진 작업이 나온다.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "page_url": {
                    "description": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "job_id": {
                      "description": "string"
                    },
                    "video_key": {
                      "description": "string"
                    },
                    "title": {
                      "description": "string"
                    },
                    "stage": {
                      "description": "string"
                    },
                    "percent": {
                      "description": "integer"
                    },
                    "failure_reason": {
                      "description": "string | null"
                    },
                    "input_amount": {
                      "description": "integer"
                    },
                    "output_amount": {
                      "description": "integer"
                    },
                    "cost_krw": {
                      "description": "number"
                    },
                    "notified": {
                      "description": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "400"
          },
          "404": {
            "description": "404"
          },
          "410": {
            "description": "video_deleted: saved job data is unavailable. deletion_token is present only when cleanup is complete; pending deletion must be retried in the library."
          }
        }
      }
    },
    "/videos/{video_key}/subtitles": {
      "get": {
        "operationId": "P8",
        "summary": "작업이 끝난 영상의 자막을 통째로 준다. 조각마다 본편 처음부터 잰 시작 시각과 끝 시각이 붙어 있어 오버레이가 재생 위치에 맞는 조각을 고른다. 광고를 가려낼 때 쓸 본편 길이도 함께 준다. 작업이 끝나기 전에는 자막을 주지 않는다.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "video_key": {
                      "description": "string"
                    },
                    "duration_ms": {
                      "description": "integer"
                    },
                    "source_language": {
                      "description": "string"
                    },
                    "cues": {
                      "description": "[{seq: integer, start_ms: integer, end_ms: integer, text_ko: string}]"
                    }
                  }
                }
              }
            }
          },
          "404": {
            "description": "404"
          },
          "409": {
            "description": "409"
          },
          "410": {
            "description": "video_deleted: clear displayed cues and ignore earlier subtitle responses. Never start translation from a subtitle read."
          }
        }
      }
    }
  }
}
