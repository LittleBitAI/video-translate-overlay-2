[package]
name = "video-translate-overlay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Korean subtitles for foreign-language tech talks: on-device speech writing, Gemini translation, an overlay on video sites."

[lib]
name = "vto"

[[bin]]
name = "vto-contract-host"
path = "src/bin/vto-contract-host.rs"

[dependencies]
# `test` gives the mock runtime the contract host runs on; `dynamic-acl` lets
# the app build its capability authority from capabilities/*.json at start-up.
tauri = { version = "2", default-features = false, features = ["wry", "test", "dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_Security_Credentials",
  "Win32_System_Com",
] }
