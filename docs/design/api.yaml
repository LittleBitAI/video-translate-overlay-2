        "summary": "Summarize a video whose subtitles are ready. Without again, a stored summary is answered with no Gemini call. Otherwise one gemini-3.1-flash-lite generateContent call under the summary system prompt, with the order {task: summary, title, terms: the job's glossary, transcript: every cue's source text in cue order} (no Korean cue text, no times; while a re-make has not finished, the selected saved version's terms, cues and recognized language, as P8 serves them) and a response JSON schema of the six fields below. The reply's values are checked in code: a non-empty Korean gist, Korean key points and prerequisites, topics and next_topics written in the talk's scripts (every letter Latin, Greek notation, or in a script making up a tenth of the transcript's letters or named for the recognized language; the title and the glossary's Korean targets do not count), whatever language code was recognized, and every topic sharing a word with the title, the glossary's source terms or the transcript (three or more letters, or a Korean word of two or more syllables beginning a word there; a word ends where Han, kana, Thai, Lao, Myanmar or Khmer meets another script; a topic word in one of those scripts, Hanja beside Hangul aside, must be said as written in a talk written with spaces and passes in a talk most of whose transcript letters are in those scripts), and in any talk a topic with no such word said there whole, as written (a same-script neighbour ends no word in a script written without spaces), at least one topic and key point, a known level; blank and repeated items are dropped. A reply that fails is not stored and an earlier summary stays. Every call's reported usage is metered into the video's cost (P7 summary_cost_krw), valid reply or not. Local app screens only: it spends the key.",
