<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Embedded lecture player</title>
  </head>
  <body style="margin: 0">
    <!-- An embedded player: its video plays a file of its own; the injected script runs here too. -->
    <video src="/vto-none/lecture.mp4" style="display: block; width: 100%; height: 100%"></video>
    <script type="module">
      import { startPage } from '/src/overlay/page.ts';
      startPage({ top: window.parent, request: async () => ({ status: 500, body: {} }) });
    </script>
  </body>
</html>
