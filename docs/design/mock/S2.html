<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>설정</title></head><body style='margin:0;background:#e6e6e6;color:#222;font-family:system-ui,sans-serif;font-size:16px'><header style='display:flex;gap:16px;align-items:center;padding:8px 16px;background:#d0d0d0'><a href='/' style='display:flex;align-items:center;height:44px;color:#222;font-size:14px'>← 영상으로</a><h1 style='margin:0;font-size:20px'>설정</h1></header><main style='max-width:560px;margin:0 auto;padding:16px'><section style='padding:16px;margin-bottom:16px;border-radius:8px;background:#f4f4f4'><h2 style='margin:0 0 8px;font-size:20px'>개인키</h2><p style='margin:0 0 16px;font-size:14px;color:#555'>개인키는 이 기기에만 저장됩니다. 번역 비용은 개인키 주인에게 청구됩니다.</p><form data-feature="set-api-key" style='margin:0'><label for='key' style='display:block;margin-bottom:4px;font-size:14px'>Gemini 개인키</label><div style='display:flex;gap:8px'><input id='key' type='password' autocomplete='off' placeholder='개인키를 붙여 넣으세요' style='flex:1;min-width:0;height:44px;box-sizing:border-box;padding:0 16px;border:1px solid #8a8a8a;border-radius:8px;background:#fff;font-size:16px'><button type='button' style='height:44px;padding:0 16px;border:0;border-radius:8px;background:#5f5f5f;color:#fff;font-size:16px'>저장</button></div><div style='display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:14px'><span>저장된 개인키</span><span style='display:inline-block;width:120px;height:16px;background:#c4c4c4;border-radius:4px'></span><span style='color:#555'>끝 네 글자만 보입니다</span></div><div style='display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:14px'><span>번역 모듈</span><span style='display:inline-block;width:160px;height:16px;background:#c4c4c4;border-radius:4px'></span></div></form><div style='margin-top:24px;padding-top:16px;border-top:1px solid #c4c4c4'><p style='margin:0 0 8px;font-size:14px;color:#555'>지우면 이 기기에서 사라지고, 영상감지 버튼을 누를 때 개인키를 넣으라는 안내가 뜹니다.</p><button data-feature="delete-api-key" type='button' style='min-height:44px;padding:0 16px;border:1px solid #5f5f5f;border-radius:8px;background:#fff;color:#222;font-size:16px'>개인키 지우기</button></div></section><section style='padding:16px;border-radius:8px;background:#f4f4f4'><h2 style='margin:0 0 8px;font-size:20px'>유튜브 로그인</h2><p style='margin:0 0 16px;font-size:14px;color:#555'>유튜브 로그인은 구글의 화면에서 하고, 앱은 비밀번호를 받거나 저장하지 않습니다. 로그아웃하면 다음에 유튜브를 열 때 구글의 계정 화면이 다시 뜹니다.</p><button data-feature="youtube-logout" type='button' style='min-height:44px;padding:0 16px;border:1px solid #5f5f5f;border-radius:8px;background:#fff;color:#222;font-size:16px'>유튜브 로그아웃</button></section></main></body></html>
